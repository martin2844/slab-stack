name: slab

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  edge:
  control:

services:
  work-migrate:
    image: ${SLAB_WORK_IMAGE:?SLAB_WORK_IMAGE is required}
    command:
      ["sh", "-c", "test \"$$(id -u)\" -ne 0 && exec node dist/db/migrate.js"]
    networks: [control]
    volumes:
      - work_data:/data
    secrets:
      - work_api_key
    environment:
      TRACKER_DB_PATH: /data/slab.db
      TRACKER_API_KEY_FILE: /run/secrets/work_api_key
    restart: "no"

  slab-api:
    <<: *service-defaults
    image: ${SLAB_WORK_IMAGE:?SLAB_WORK_IMAGE is required}
    command: ["node", "dist/index.js"]
    expose: ["6970"]
    networks: [control]
    volumes:
      - work_data:/data
    secrets:
      - work_api_key
    environment:
      PORT: "6970"
      TRACKER_DB_PATH: /data/slab.db
      TRACKER_API_KEY_FILE: /run/secrets/work_api_key
      SKIP_MIGRATIONS: "true"
    depends_on:
      work-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6970/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  slab-mcp:
    <<: *service-defaults
    image: ${SLAB_WORK_IMAGE:?SLAB_WORK_IMAGE is required}
    command: ["node", "dist/mcp/server.js"]
    expose: ["6969"]
    networks: [control]
    volumes:
      - work_data:/data
    secrets:
      - work_api_key
    environment:
      TRACKER_MCP_PORT: "6969"
      TRACKER_MCP_MODE: http
      TRACKER_DB_PATH: /data/slab.db
      TRACKER_API_KEY_FILE: /run/secrets/work_api_key
      SKIP_MIGRATIONS: "true"
    depends_on:
      work-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6969/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  docs-migrate:
    image: ${SLAB_DOCS_IMAGE:?SLAB_DOCS_IMAGE is required}
    command:
      ["sh", "-c", "test \"$$(id -u)\" -ne 0 && exec node dist/db/migrate.js"]
    networks: [control]
    volumes:
      - docs_data:/data
    environment:
      DOCS_DB_PATH: /data/slab-docs.db
    restart: "no"

  slab-docs:
    <<: *service-defaults
    image: ${SLAB_DOCS_IMAGE:?SLAB_DOCS_IMAGE is required}
    expose: ["6980"]
    networks: [control]
    volumes:
      - docs_data:/data
    secrets:
      - docs_api_key
    environment:
      HOST: 0.0.0.0
      PORT: "6980"
      DOCS_DB_PATH: /data/slab-docs.db
      DOCS_API_KEY_FILE: /run/secrets/docs_api_key
      NODE_ENV: production
      SKIP_MIGRATIONS: "true"
    depends_on:
      docs-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6980/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  email-migrate:
    image: ${SLAB_EMAIL_IMAGE:?SLAB_EMAIL_IMAGE is required}
    command:
      ["sh", "-c", "test \"$$(id -u)\" -ne 0 && exec node dist/db/migrate.js"]
    networks: [control]
    volumes:
      - email_data:/data
    environment:
      DATABASE_PATH: /data/slab-email.db
    restart: "no"

  slab-email:
    <<: *service-defaults
    image: ${SLAB_EMAIL_IMAGE:?SLAB_EMAIL_IMAGE is required}
    expose: ["6981"]
    networks: [control]
    volumes:
      - email_data:/data
    secrets:
      - email_admin_key
      - email_master_key
    environment:
      HOST: 0.0.0.0
      PORT: "6981"
      DATABASE_PATH: /data/slab-email.db
      SLAB_EMAIL_ADMIN_KEY_FILE: /run/secrets/email_admin_key
      SLAB_EMAIL_MASTER_KEY_FILE: /run/secrets/email_master_key
      PUBLIC_ADMIN_ALLOWED_ORIGINS: slab-agents:3009
      MCP_ALLOWED_ORIGINS: slab-agents:3009
      MCP_ALLOWED_ORIGINS_HOSTS: slab-agents
      NODE_ENV: production
      SKIP_MIGRATIONS: "true"
    depends_on:
      email-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6981/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  slab-runner:
    <<: *service-defaults
    image: ${SLAB_RUNNER_IMAGE:?SLAB_RUNNER_IMAGE is required}
    expose: ["6990"]
    networks: [control]
    volumes:
      - runner_codex:/var/lib/slab-runner/codex
      - runner_gemini:/var/lib/slab-runner/gemini
    secrets:
      - runner_token
    environment:
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: "6990"
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_CODEX_HOME: /var/lib/slab-runner/codex
      RUNNER_GEMINI_HOME: /var/lib/slab-runner/gemini
      CODEX_BIN: /usr/local/bin/codex
      GEMINI_BIN: /usr/local/bin/gemini
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6990/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  honcho-database:
    <<: *service-defaults
    profiles: [memory]
    image: ${SLAB_HONCHO_DATABASE_IMAGE:?SLAB_HONCHO_DATABASE_IMAGE is required}
    command: ["postgres", "-c", "max_connections=200"]
    networks: [control]
    volumes:
      - honcho_db_data:/var/lib/postgresql/data
    secrets:
      - honcho_db_password
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/honcho_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  honcho-redis:
    <<: *service-defaults
    profiles: [memory]
    image: ${SLAB_HONCHO_REDIS_IMAGE:?SLAB_HONCHO_REDIS_IMAGE is required}
    command: ["redis-server", "--appendonly", "yes"]
    networks: [control]
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  honcho-api:
    <<: *service-defaults
    profiles: [memory]
    image: ${SLAB_HONCHO_IMAGE:?SLAB_HONCHO_IMAGE is required}
    entrypoint:
      - sh
      - -c
      - |
        export LLM_OPENAI_API_KEY="$$(cat /run/secrets/honcho_openai_api_key)"
        export DB_CONNECTION_URI="postgresql+psycopg://postgres:$$(cat /run/secrets/honcho_db_password)@honcho-database:5432/postgres"
        exec sh docker/entrypoint.sh
    expose: ["8000"]
    networks: [control]
    secrets:
      - honcho_openai_api_key
      - honcho_db_password
    environment:
      AUTH_USE_AUTH: "false"
      CACHE_ENABLED: "true"
      CACHE_URL: redis://honcho-redis:6379/0?suppress=true
      SENTRY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  honcho-deriver:
    <<: *service-defaults
    profiles: [memory]
    image: ${SLAB_HONCHO_IMAGE:?SLAB_HONCHO_IMAGE is required}
    entrypoint:
      - sh
      - -c
      - |
        export LLM_OPENAI_API_KEY="$$(cat /run/secrets/honcho_openai_api_key)"
        export DB_CONNECTION_URI="postgresql+psycopg://postgres:$$(cat /run/secrets/honcho_db_password)@honcho-database:5432/postgres"
        exec /app/.venv/bin/python -m src.deriver
    networks: [control]
    secrets:
      - honcho_openai_api_key
      - honcho_db_password
    environment:
      AUTH_USE_AUTH: "false"
      CACHE_ENABLED: "true"
      CACHE_URL: redis://honcho-redis:6379/0?suppress=true
      SENTRY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    depends_on:
      honcho-api:
        condition: service_healthy
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  slab-agents:
    <<: *service-defaults
    image: ${SLAB_AGENTS_IMAGE:?SLAB_AGENTS_IMAGE is required}
    expose: ["3009"]
    networks: [edge, control]
    volumes:
      - agents_data:/data
    secrets:
      - work_api_key
      - docs_api_key
      - runner_token
      - email_admin_key
      - session_secret
      - honcho_api_key
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3009"
      NODE_ENV: production
      SLAB_WORKSPACE_DB: /data/slab-workspace.db
      SLAB_PUBLIC_URL: ${SLAB_PUBLIC_URL:?SLAB_PUBLIC_URL is required}
      CONTROL_PLANE_INTERNAL_URL: http://slab-agents:3009
      WORK_MCP_URL: http://slab-mcp:6969/mcp
      DOCS_MCP_URL: http://slab-docs:6980/mcp
      RUNNER_URL: http://slab-runner:6990
      SLAB_EMAIL_URL: http://slab-email:6981
      TRACKER_API_KEY_FILE: /run/secrets/work_api_key
      DOCS_API_KEY_FILE: /run/secrets/docs_api_key
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      SLAB_EMAIL_ADMIN_KEY_FILE: /run/secrets/email_admin_key
      SLAB_SESSION_SECRET_FILE: /run/secrets/session_secret
      MEMORY_PROVIDER: ${SLAB_MEMORY_PROVIDER:-disabled}
      HONCHO_URL: ${SLAB_HONCHO_URL:-https://api.honcho.dev}
      HONCHO_API_KEY_FILE: ${SLAB_HONCHO_API_KEY_FILE_IN_CONTAINER:-}
      HONCHO_WORKSPACE_ID: ${SLAB_HONCHO_WORKSPACE_ID:-slab}
      MEMORY_MAX_CONTEXT_TOKENS: ${SLAB_MEMORY_MAX_CONTEXT_TOKENS:-900}
    depends_on:
      slab-api:
        condition: service_healthy
      slab-mcp:
        condition: service_healthy
      slab-docs:
        condition: service_healthy
      slab-email:
        condition: service_healthy
      slab-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3009/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  agents_data:
  work_data:
  docs_data:
  email_data:
  runner_codex:
  runner_gemini:
  honcho_db_data:
  honcho_redis_data:

secrets:
  work_api_key:
    file: ./secrets/work-api-key
  docs_api_key:
    file: ./secrets/docs-api-key
  runner_token:
    file: ./secrets/runner-token
  email_admin_key:
    file: ./secrets/email-admin-key
  email_master_key:
    file: ./secrets/email-master-key
  session_secret:
    file: ./secrets/session-secret
  honcho_api_key:
    file: ./secrets/honcho-api-key
  honcho_openai_api_key:
    file: ./secrets/honcho-openai-api-key
  honcho_db_password:
    file: ./secrets/honcho-db-password
