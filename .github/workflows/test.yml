name: Test stack contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Shellcheck
        run: shellcheck scripts/*.sh installer/lib/*.sh
      - name: Validate manifest parser
        run: node --check scripts/validate-manifest.mjs
      - name: Test release contracts
        run: npm test
      - name: Validate stack contracts
        run: ./scripts/check.sh
