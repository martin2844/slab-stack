name: Publish signed stack release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Resolve tagged manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          manifest="releases/v${version}.json"
          test -f "$manifest"
          test "$(jq -r '.stackVersion' "$manifest")" = "$version"
          channel=$(jq -r '.channel' "$manifest")
          case "$channel" in
            candidate) prerelease=true ;;
            drill) prerelease=true ;;
            stable) prerelease=false ;;
            *) echo "Only candidate, stable, and drill manifests can be released." >&2; exit 1 ;;
          esac
          printf 'version=%s\nmanifest=%s\nchannel=%s\nprerelease=%s\n' \
            "$version" "$manifest" "$channel" "$prerelease" >> "$GITHUB_OUTPUT"
      - name: Validate release contracts
        run: |
          shellcheck bootstrap/install.sh bin/slabctl scripts/*.sh installer/*.sh installer/lib/*.sh
          npm test
          ./scripts/check.sh
      - name: Build reproducible release bundle
        run: ./scripts/package-release.sh "${{ steps.release.outputs.manifest }}" dist
      - name: Sign bundle checksum
        shell: bash
        env:
          SLAB_RELEASE_SIGNING_KEY_PEM: ${{ secrets.SLAB_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$SLAB_RELEASE_SIGNING_KEY_PEM"
          umask 077
          signing_key=$(mktemp "$RUNNER_TEMP/slab-release-signing.XXXXXX.pem")
          derived_public=$(mktemp "$RUNNER_TEMP/slab-release-public.XXXXXX.pem")
          cleanup() {
            rm -f "$signing_key" "$derived_public"
          }
          trap cleanup EXIT HUP INT TERM
          printf '%s\n' "$SLAB_RELEASE_SIGNING_KEY_PEM" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$derived_public"
          cmp -s "$derived_public" contracts/release-signing-public.pem
          checksum="dist/slab-stack-${{ steps.release.outputs.version }}.tar.gz.sha256"
          openssl pkeyutl -sign -rawin -inkey "$signing_key" \
            -in "$checksum" -out "$checksum.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey contracts/release-signing-public.pem \
            -in "$checksum" -sigfile "$checksum.sig"
          channel="${{ steps.release.outputs.channel }}"
          manifest="dist/v${{ steps.release.outputs.version }}.json"
          manifest_sha256=$(sha256sum "$manifest" | awk '{print $1}')
          jq -n \
            --arg channel "$channel" \
            --arg stackVersion "${{ steps.release.outputs.version }}" \
            --arg manifestUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/v${{ steps.release.outputs.version }}.json" \
            --arg manifestSha256 "$manifest_sha256" \
            '{schemaVersion:1,channel:$channel,stackVersion:$stackVersion,manifestUrl:$manifestUrl,manifestSha256:$manifestSha256}' \
            > "dist/$channel.json"
          openssl pkeyutl -sign -rawin -inkey "$signing_key" \
            -in "dist/$channel.json" -out "dist/$channel.json.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey contracts/release-signing-public.pem \
            -in "dist/$channel.json" -sigfile "dist/$channel.json.sig"
          cp bootstrap/install.sh dist/install.sh
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${{ steps.release.outputs.prerelease }}" == true ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Slab Stack ${{ steps.release.outputs.version }}" \
            --notes "Signed, versioned Slab self-hosted installer bundle." \
            "${release_flags[@]}"
          channel="${{ steps.release.outputs.channel }}"
          channel_tag="channel-$channel"
          if ! gh release view "$channel_tag" >/dev/null 2>&1; then
            gh release create "$channel_tag" --prerelease \
              --title "Slab $channel channel" \
              --notes "Machine-readable signed pointer for the Slab $channel channel."
          fi
          gh release upload "$channel_tag" \
            "dist/$channel.json" "dist/$channel.json.sig" --clobber
